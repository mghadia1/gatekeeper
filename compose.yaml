# The gateway in front of test backends (all the echo service): "users" with
# two instances, and "orders". Redis arrives in Milestone 3, Prometheus in
# Milestone 5.
x-echo: &echo
  build:
    context: .
    target: echo
  restart: unless-stopped

services:
  gatekeeper:
    build:
      context: .
      target: gatekeeper
      args:
        VERSION: ${VERSION:-dev}
    ports:
      - "8080:8080"
    environment:
      GATEKEEPER_CONFIG: /etc/gatekeeper/config.json
    volumes:
      - ./config/gatekeeper.json:/etc/gatekeeper/config.json:ro
    depends_on:
      users-1:
        condition: service_healthy
      users-2:
        condition: service_healthy
      orders:
        condition: service_healthy
    restart: unless-stopped

  users-1:
    <<: *echo
    environment:
      ECHO_NAME: users-1

  users-2:
    <<: *echo
    environment:
      ECHO_NAME: users-2

  orders:
    <<: *echo
    environment:
      ECHO_NAME: orders
